services:
  hometown-hub:
    build: .
    image: hometown-hub:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - hometown-hub-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  hometown-hub-data:
